<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartDuken AI — Өнімдер</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer>
</script>
</head>
<body>
<header>
<span class="brand">SmartDuken AI</span>
<p>Дүкен қоры — бір жерде</p>
</header>
<main>
<section aria-labelledby="list-title">
<div class="heading">
<div>
<span class="eyebrow">ҚОЙМА</span>
<h1 id="list-title">Өнімдер</h1>
</div>
<button id="refresh" type="button">Жаңарту</button>
</div>
<p id="status" role="status" aria-live="polite">
</p>
<div class="table-wrap">
<table>
<thead>
<tr>
<th scope="col">Атауы</th>
<th scope="col">Санаты</th>
<th scope="col">Бағасы</th>
<th scope="col">Қоры</th>
<th scope="col">Ең аз қор</th>
<th scope="col">Әрекеттер</th>
</tr>
</thead>
<tbody id="products">
</tbody>
</table>
</div>
<p id="empty" hidden>Әзірге өнім жоқ. Алғашқы өнімді қосыңыз.</p>
</section>
<aside>
<h2 id="form-title">Өнім қосу</h2>
<form id="product-form">
<label for="name">Өнім атауы</label>
<input id="name" name="name" maxlength="150" required placeholder="Мысалы, сүт">
<label for="category">Санаты</label>
<input id="category" name="category" maxlength="100" placeholder="Сүт өнімдері">
<label for="price">Бағасы (₸)</label>
<input id="price" name="price" type="number" min="0" max="99999999999999999.99" step="0.01" required>
<div class="fields">
<div>
<label for="stockQuantity">Қор саны</label>
<input id="stockQuantity" name="stockQuantity" type="number" min="0" max="2147483647" step="1" required>
</div>
<div>
<label for="minimumStock">Ең аз қор</label>
<input id="minimumStock" name="minimumStock" type="number" min="0" max="2147483647" step="1" required>
</div>
</div>
<button id="save" class="primary" type="submit">Өнімді қосу</button>
<button id="cancel" type="button" hidden>Бас тарту</button>
<p id="form-status" role="status" aria-live="polite">
</p>
</form>
</aside>
</main>
<footer>SmartDuken AI · Шағын дүкенге арналған қор есебі</footer>
</body>
</html>
